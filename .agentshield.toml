[scan]
# Skip test files (tests/, __tests__/, *.test.ts, etc.) before parsing.
ignore_tests = true

# docs/ contains prose that documents detector patterns and harness scripts.
# vscode/ is a VS Code client extension (UI prompts).
# python/ is the PyPI CLI wrapper that invokes the agentshield binary.
# skills/ and install.sh are installation and agent guidance scripts.
# .github/ and .claude/ (CI, hooks, commands, and agent configs) are scanned: dot-directories are included.
# .claude/worktrees/ and .worktrees/ hold local git worktree checkouts (ignored by git).
exclude = ["docs/**", "vscode/**", "skills/**", "python/**", "install.sh", ".claude/worktrees/**", ".worktrees/**"]

