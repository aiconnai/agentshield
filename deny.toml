[advisories]
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is an archived transitive dependency of serde_yaml; all YAML inputs are size-capped at 1 MiB before parsing" },
]

[licenses]
confidence-threshold = 0.95
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
]

[bans]
multiple-versions = "deny"
wildcards = "allow"

[[bans.features]]
name = "tokio"
deny = ["full"]

