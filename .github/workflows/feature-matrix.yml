name: Cargo Feature Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  feature-matrix:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: No default features
            command: cargo test --no-default-features --locked
          - name: Python parser
            command: cargo check --no-default-features --features python --locked
          - name: TypeScript parser
            command: cargo check --no-default-features --features typescript --locked
          - name: Runtime
            command: cargo check --no-default-features --features runtime --locked
          - name: Runtime guard
            command: cargo check --no-default-features --features runtime,runtime-guard --locked
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.name }}
      - run: ${{ matrix.command }}
