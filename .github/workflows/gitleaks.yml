name: Gitleaks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:v8.23.3 \
            detect \
              --source /src \
              --config /src/.gitleaks.toml \
              --gitleaks-ignore-path /src/.gitleaksignore \
              --verbose \
              --redact \
              --report-format sarif \
              --report-path /src/gitleaks.sarif \
              --exit-code 1

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b47f3d7a9e # v3.28.10
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
