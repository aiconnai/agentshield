name: Gitleaks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            zricethezav/gitleaks:v8.23.3 \
            detect \
              --source /src \
              --config /src/.gitleaks.toml \
              --gitleaks-ignore-path /src/.gitleaksignore \
              --verbose \
              --redact \
              --report-format sarif \
              --report-path /src/gitleaks.sarif \
              --exit-code 1

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3.28.11
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
