name: Python Package (PyPI)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI via Trusted Publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Required for PyPI Trusted Publishing (OIDC)

jobs:
  test:
    name: Test Python Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Python unit tests
        run: |
          uv run --with pytest pytest python/tests

  build-wheels:
    name: Build wheels (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build wheel via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --features full
          manylinux: auto

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: target/wheels/*.whl

  build-sdist:
    name: Build source distribution
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    name: Publish to PyPI
    if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) && !cancelled()
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentshield
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
