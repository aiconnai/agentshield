name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-invariants:
    name: Release Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify release workflow contracts
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          .github/scripts/check-release-invariants.sh "v${version}"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7fe936077b32b09841a51c6a70863c3d18d4 # stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4da527196677d49a8c197 # v2.7.7
      - run: cargo test --all-features --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7fe936077b32b09841a51c6a70863c3d18d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4da527196677d49a8c197 # v2.7.7
      - run: cargo clippy --all-features --locked -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7fe936077b32b09841a51c6a70863c3d18d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7fe936077b32b09841a51c6a70863c3d18d4 # stable
      - uses: taiki-e/install-action@b700f135b91b93f1ef1e89cf29969f69185a76c0 # v2.49.18
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Ensure the binary builds and runs
  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@a54c7fe936077b32b09841a51c6a70863c3d18d4 # stable
      - uses: Swatinem/rust-cache@82a92a6e8fbeee08c6c4da527196677d49a8c197 # v2.7.7
      - run: cargo build --release
      - run: ./target/release/agentshield list-rules
      - run: ./target/release/agentshield scan tests/fixtures/mcp_servers/safe_calculator --format json > /dev/null
      - name: Verify vuln detection
        run: |
          set +e
          ./target/release/agentshield scan tests/fixtures/mcp_servers/vuln_cmd_inject
          EXIT_CODE=$?
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "Expected exit code 1 (findings above threshold), got $EXIT_CODE"
            exit 1
          fi

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5a1 # v4.1.0
        with:
          node-version: 20
      - name: Build extension
        run: |
          cd vscode
          npm ci
          npm run compile
          npm run package
