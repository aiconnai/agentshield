name: VS Code Extension

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "vscode/**"
      - ".github/workflows/vscode.yml"
  pull_request:
    branches: [main]
    paths:
      - "vscode/**"
      - ".github/workflows/vscode.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Marketplace and Open VSX (if PATs are configured)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-package:
    name: Compile, test, audit, and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Package VSIX
        run: npx vsce package --out agentshield.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: agentshield-vsix
          path: vscode/agentshield.vsix
          retention-days: 14

      # Publish to Visual Studio Marketplace if VSCE_PAT secret is available
      - name: Publish to VS Code Marketplace
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) && env.VSCE_PAT != ''
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish -p "$VSCE_PAT" || echo "VSCE version already published or skipped"

      # Publish to Open VSX Registry if OVSX_PAT secret is available
      - name: Publish to Open VSX Registry
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish == true) && env.OVSX_PAT != ''
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx -y ovsx publish agentshield.vsix -p "$OVSX_PAT" || echo "Open VSX version already published or skipped"
