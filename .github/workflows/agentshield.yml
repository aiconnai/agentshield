name: AgentShield

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: "build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build AgentShield
        run: cargo build --release --locked

      - name: Run AgentShield
        uses: ./
        with:
          path: .
          config: .agentshield.toml
          binary-path: ${{ github.workspace }}/target/release/agentshield
          fail-on: high
          ignore-tests: true
          format: sarif
          upload-sarif: true
