name: AgentShield

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Run AgentShield
        uses: aiconnai/agentshield@2cdc008e1e4229f46e47eb2a5f47549fda7ae508 # v1.0.3
        with:
          path: .
          config: .agentshield.toml
          fail-on: high
          ignore-tests: true
          format: sarif
          upload-sarif: true
